name: Apply screenshot-linked UI LQA fixes
on:
  push:
    branches: [fix/lqa-tricorder-gps-mech-20260925]
    paths: [.github/workflows/apply-ui-lqa.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lqa-tricorder-gps-mech-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install deterministic image and Lua test tools
        run: python -m pip install Pillow==11.3.0 lupa==2.8
      - name: Fetch exact upstream source
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git "$RUNNER_TEMP/fu_source"
          git -C "$RUNNER_TEMP/fu_source" fetch --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/fu_source" checkout --detach "$PIN"
      - name: Apply source-only migration
        run: python tools/apply_ui_lqa_20260925.py --source "$RUNNER_TEMP/fu_source"
      - name: Compile, regressions, terminology and UI source gate
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/qa_integrity.py
          python tools/check_ui_lqa_20260925.py --source "$RUNNER_TEMP/fu_source"
      - name: Build every catalog field against pinned FU
        run: |
          python tools/build_validate.py --source-dir "$RUNNER_TEMP/fu_source" --output "$RUNNER_TEMP/lqa_build"
          FU_TEST_MOD_DIR="$RUNNER_TEMP/lqa_build/FU_Turkce" python -m unittest discover -s tools/tests -p 'test_lua_behavior.py' -v
          FU_TEST_MOD_DIR="$RUNNER_TEMP/lqa_build/FU_Turkce" python -m unittest discover -s tools/tests -p 'test_ui_lqa_20260925.py' -v
      - name: Commit only validated source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Workflow edits are published separately by an authorized maintainer.
          git restore --worktree -- .github/workflows
          git add -- tools/ceviriler.json tools/kaynaklar.json tools/v*_translations.json tools/raw_text_translations.json tools/raw_runtime_overrides.json tools/raw_overrides tools/custom_assets.json tools/custom_assets tools/build_validate.py tools/audit_remaining.py tools/tests/test_lua_behavior.py tools/generate_v039.py tools/generate_v042.py tools/generate_v043.py FU_SESSION_CHECKPOINT.md
          git add -u -- tools/apply_ui_lqa_20260925.py
          git diff --cached --check
          if git diff --cached --name-only | grep -E '^(FU_Turkce/|dist/|.github/workflows/|tools/test_raporu.json|tools/GELISTIRME.txt)'; then exit 1; fi
          git commit -m "fix: close screenshot-linked Tricorder GPS Mech and radio LQA gaps"
          git push origin HEAD:fix/lqa-tricorder-gps-mech-20260925
