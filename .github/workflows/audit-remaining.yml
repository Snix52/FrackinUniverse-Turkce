name: FU Turkce Remaining Scope Audit

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "tools/audit_remaining.py"
      - "tools/ceviriler.json"
      - "tools/*_translations.json"
      - "tools/kaynaklar.json"
      - "tools/rules/*.json"
      - "tools/write_build_evidence.py"
      - "tools/rule_data.py"
      - "tools/qa_raw.py"
      - "tools/qa_integrity.py"
      - "tools/plan_translation.py"
      - "tools/translation_priorities.json"
      - "tools/translation_memory_exceptions.json"
      - "tools/locked_terms.json"
      - "tools/tests/test_translation_planning.py"
      - ".github/workflows/audit-remaining.yml"

concurrency:
  group: fu-turkce-scope-audit
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout translation repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch pinned Frackin Universe source
        run: |
          FU_SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_SOURCE_COMMIT"

      - name: Compile audit dependencies
        run: python -m py_compile tools/audit_remaining.py tools/write_build_evidence.py

      - name: Audit remaining player-visible strings
        run: python tools/audit_remaining.py --source fu_source

      - name: Test translation planning safety
        run: python -m unittest discover -s tools/tests -p test_translation_planning.py -v

      - name: Prepare gameplay queue and draft packet
        run: python tools/plan_translation.py --source fu_source --output audit_output/planning

      - name: Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: fu-turkce-remaining-scope
          path: audit_output
          if-no-files-found: error
