name: FU Turkce Build and QA

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
      - "FU_Turkce/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python
        run: python -m py_compile tools/build_validate.py tools/add_v022.py tools/add_v023.py tools/add_v024.py tools/add_v025.py tools/add_v026.py tools/add_v027.py tools/add_v028.py tools/add_v029.py tools/add_v030.py

      - name: Fetch pinned Frackin Universe source
        run: |
          FU_SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_SOURCE_COMMIT"

      - name: Build and run full-source static QA
        run: python tools/build_validate.py --source-dir fu_source --output build_output

      - name: Refresh tracked install tree
        run: |
          rm -rf FU_Turkce
          cp -a build_output/FU_Turkce FU_Turkce
          diff -qr build_output/FU_Turkce FU_Turkce

      - name: Package mod
        run: |
          rm -f dist/FU_Turkce_v0.20.0_Beta.zip dist/FU_Turkce_v0.21.0_Beta.zip dist/FU_Turkce_v0.22.0_Beta.zip dist/FU_Turkce_v0.23.0_Beta.zip dist/FU_Turkce_v0.24.0_Beta.zip dist/FU_Turkce_v0.25.0_Beta.zip dist/FU_Turkce_v0.26.0_Beta.zip dist/FU_Turkce_v0.27.0_Beta.zip dist/FU_Turkce_v0.28.0_Beta.zip dist/FU_Turkce_v0.29.0_Beta.zip dist/FU_Turkce_v0.30.0_Beta.zip
          cd build_output
          zip -r ../dist/FU_Turkce_v0.30.0_Beta.zip FU_Turkce

      - name: Verify ZIP
        run: unzip -t dist/FU_Turkce_v0.30.0_Beta.zip

      - name: Refresh tracked beta package and install tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A dist FU_Turkce
          if git diff --cached --quiet; then
            echo "Package and install tree are already current."
          else
            git commit -m "build: refresh v0.30.0 beta package and install tree [skip ci]"
            git push
          fi
