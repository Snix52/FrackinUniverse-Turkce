name: FU Turkce Build and QA

on:
  push:
    branches:
      - main
    paths-ignore:
      - "dist/**"
      - "FU_Turkce/**"
      - "tools/test_raporu.json"
      - "tools/GELISTIRME.txt"
  workflow_dispatch:

concurrency:
  group: fu-turkce-main-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  BUILD_SOURCE_SHA: ${{ github.sha }}

jobs:
  build-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BUILD_SOURCE_SHA }}

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Verify checkout identity
        run: test "$(git rev-parse HEAD)" = "$BUILD_SOURCE_SHA"

      - name: Compile tools and run regression tests
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v

      - name: Resolve package path
        run: |
          PACKAGE_PATH="$(python - <<'PY'
          import json
          version = json.load(open('tools/ceviriler.json', encoding='utf-8'))['translation_version']
          base = version.split('-', 1)[0]
          suffix = '_Beta' if 'beta' in version.lower() else ''
          print(f'dist/FU_Turkce_v{base}{suffix}.zip')
          PY
          )"
          echo "PACKAGE_PATH=$PACKAGE_PATH" >> "$GITHUB_ENV"

      - name: Fetch pinned Frackin Universe source
        run: |
          FU_SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_SOURCE_COMMIT"

      - name: Verify v0.45 layered quest sources
        run: python tools/generate_v045.py --source fu_source

      - name: Build and run full-source static QA
        run: python tools/build_validate.py --source-dir fu_source --output build_output

      - name: Refresh tracked install tree
        run: |
          rm -rf FU_Turkce
          cp -a build_output/FU_Turkce FU_Turkce
          diff -qr build_output/FU_Turkce FU_Turkce

      - name: Package verified build and generate fresh QA evidence
        run: |
          mkdir -p dist
          find dist -maxdepth 1 -type f -name 'FU_Turkce_v*_Beta.zip' -delete
          python tools/write_build_evidence.py \
            --zip "$PACKAGE_PATH" \
            --output dist/build-evidence.json \
            --create-zip --refresh-tracked \
            --translation-source-commit "$BUILD_SOURCE_SHA" \
            --workflow-run-id "$GITHUB_RUN_ID"

      - name: Verify ZIP and generated diff
        run: |
          unzip -t "$PACKAGE_PATH"
          git diff --check

      - name: Publish only if main still equals the build source revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python tools/publish_generated.py --source-sha "$BUILD_SOURCE_SHA"
