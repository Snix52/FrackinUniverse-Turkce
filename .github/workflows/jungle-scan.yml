name: jungle terminology scan
on:
  push:
    branches: [fix/jungle-terminology]
    paths:
      - .github/workflows/jungle-scan.yml
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Scan repository and translation rows
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          print("=== RAW CANGIL OCCURRENCES ===")
          hits=[]
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  text=p.read_text(encoding='utf-8')
              except Exception:
                  continue
              if 'cangıl' in text.casefold():
                  for i,line in enumerate(text.splitlines(),1):
                      if 'cangıl' in line.casefold():
                          hits.append((p.as_posix(),i,line.strip()))
          for h in hits:
              print(f"{h[0]}:{h[1]}: {h[2]}")
          print("RAW_COUNT", len(hits))

          print("\n=== TRANSLATION ROWS WITH JUNGLE/CANGIL ===")
          files=[Path('tools/ceviriler.json')] + sorted(Path('tools').glob('v*_translations.json'))
          seen=set()
          rows=[]
          for p in files:
              try:
                  data=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              payload=data.get('translations',[]) if isinstance(data,dict) else []
              for r in payload:
                  if not isinstance(r,dict): continue
                  en=str(r.get('en','')); tr=str(r.get('tr',''))
                  if 'jungle' in en.casefold() or 'cangıl' in tr.casefold():
                      key=(r.get('asset'),r.get('pointer'),en,tr)
                      if key in seen: continue
                      seen.add(key); rows.append((p.as_posix(),)+key)
          for x in rows:
              print(json.dumps({
                  'file':x[0],'asset':x[1],'pointer':x[2],'en':x[3],'tr':x[4]
              },ensure_ascii=False))
          print("ROW_COUNT",len(rows))
          PY
