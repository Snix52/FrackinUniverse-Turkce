name: LQA screenshot source probe
on:
  push:
    branches: [fix/lqa-tricorder-gps-mech-20260925]
    paths: [.github/workflows/lqa-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - name: Inspect only screenshot-linked inputs
        run: |
          python - <<'PY'
          import json, sys, hashlib, io, urllib.request
          from pathlib import Path
          from PIL import Image
          sys.path.insert(0, 'tools')
          from audit_remaining import parse_jsonc
          pin=json.loads(Path('tools/kaynaklar.json').read_text())['commit']
          assert pin=='bb58383c0d16c1152e3439e606b39ff82288b586'
          def source(path):
              url=f'https://raw.githubusercontent.com/sayterdarkwynd/FrackinUniverse/{pin}/{path}'
              raw=urllib.request.urlopen(url, timeout=60).read()
              sha=hashlib.sha1(f'blob {len(raw)}\0'.encode()+raw).hexdigest()
              print('SOURCE', path, sha, len(raw))
              return raw
          cat=json.loads(Path('tools/ceviriler.json').read_text(encoding='utf-8'))
          print('VERSION',cat['translation_version'])
          for r in cat['translations']:
              a,p=r['asset'],r['pointer']
              selected=(a=='interface/scripted/statWindow/statWindow.config' and p.startswith('/gui/') and any(s in p.lower() for s in ['button','windowtitle','statslabel'])) or (a=='interface/objectcrafting/fu_pethouse/fu_pethouse.config' and 'randomise' in p) or (a=='interface/mechfuel/mechfuel.config') or (a=='_FUversioning.config') or (a.startswith('zb/newSail/') and ('bakiye' in r['tr'].lower() or 'status' in r['en'].lower())) or (a.startswith('radiomessages/') and any(s in r['en'] for s in ['useful gadgets','absolutely essential','comfy couch','complete several']))
              if selected: print('CATALOG',json.dumps(r,ensure_ascii=False))
          terms=json.loads(Path('tools/locked_terms.json').read_text(encoding='utf-8'))
          for t in terms['terms']:
              if t['source'] in ['SAIL','S.A.I.L','S.A.I.L.','Personal Tricorder','Matter Manipulator','Mining Laser','STL Drive','Small FTL Drive','Outpost','Fuel','Oil','Biofuel','Power Core','Research System','Primitive Spear','Codex','Hacker','Core']:
                  print('TERM',json.dumps(t,ensure_ascii=False))
          rm=json.loads(Path('tools/raw_text_translations.json').read_text(encoding='utf-8'))
          for s in rm['assets']:
              if s['asset'] in ['interface/mechfuel/mechfuel.lua','interface/kukagps/kukagps.lua','zb/newSail/fu_customFunctions.lua']:
                  print('RAW',json.dumps(s,ensure_ascii=False))
          v=parse_jsonc(source('_FUversioning.config').decode('utf-8-sig'))
          print('WELCOME',json.dumps(v.get('welcome'),ensure_ascii=False))
          print('VERSIONING_KEYS',list(v))
          for p in ['radiomessages/tutorial.radiomessages.patch','radiomessages/exploration.radiomessages.patch','radiomessages/quests.radiomessages.patch']:
              d=parse_jsonc(source(p).decode('utf-8-sig'))
              for op in d:
                  if any(s in json.dumps(op) for s in ['useful gadgets','absolutely essential','comfy couch','complete several']):
                      print('RADIO',p,json.dumps(op,ensure_ascii=False))
          for p in ['interface/objectcrafting/fu_pethouse/fu_pethouse.config','interface/scripted/statWindow/statWindow.config']:
              d=parse_jsonc(source(p).decode('utf-8-sig'))
              for k,v in d.get('gui',{}).items():
                  if any(s in k.lower() for s in ['button','randomise','statslabel']):print('UI',p,k,json.dumps(v,ensure_ascii=False))
          for p in ['zb/newSail/fu_customFunctions.lua','zb/updateInfoWindow/updateInfoWindow.lua']:
              lines=source(p).decode('utf-8-sig').splitlines()
              for i,l in enumerate(lines):
                  if any(s in l for s in ['atmosphere mode','_FUversioning','welcome']):
                      print('RUNTIME',p,i+1,'\n'.join(lines[max(0,i-2):i+3]))
          for name in ['body','deploy','deployhover','deploypressed','emptyfuel','emptyfuelhover','emptyfuelpressed']:
              path='interface/mechfuel/'+name+'.png'
              im=Image.open(io.BytesIO(source(path))).convert('RGBA')
              print('IMAGE',name,im.size)
              w,h=im.size
              for y in range(h):
                  xs=[x for x in range(160 if name=='body' else 3,w-3) if im.getpixel((x,y))[:3]==(255,255,255) and im.getpixel((x,y))[3]>0]
                  if xs:print('WHITE',name,y,min(xs),max(xs),len(xs))
              if name=='body':
                  from collections import Counter
                  for box in [(220,60,270,74),(170,90,320,104),(180,115,320,130)]:
                      print('BACKGROUND',box,Counter(im.crop(box).getdata()).most_common(5))
          PY
