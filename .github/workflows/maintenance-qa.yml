name: FU Turkce Maintenance QA

on:
  push:
    branches: [maintenance/qa-integrity-20260921]
  pull_request:
    branches: [main]
    paths:
      - 'tools/**'
      - 'docs/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fu-maintenance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Archive exact source revision for reproducible review
        run: git archive --format=tar -o "$RUNNER_TEMP/translation-source.tar" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: translation-source-${{ github.sha }}
          path: ${{ runner.temp }}/translation-source.tar
          retention-days: 3
      - name: Compile tools
        run: python -m compileall -q tools
      - name: Run standalone regression tests when present
        run: |
          if [ -d tools/tests ]; then
            python -m unittest discover -s tools/tests -v
          fi
      - name: Fetch pinned Frackin Universe source
        run: |
          FU_SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_SOURCE_COMMIT"
      - name: Full-source static QA and package verification
        run: |
          mkdir -p maintenance_results
          set -o pipefail
          python tools/build_validate.py --source-dir fu_source --output build_output | tee maintenance_results/build.log
          (cd build_output && zip -qr ../maintenance_results/FU_Turkce.zip FU_Turkce)
          unzip -t maintenance_results/FU_Turkce.zip > maintenance_results/zip-integrity.log
      - name: Remaining scope audit
        run: python tools/audit_remaining.py --source fu_source
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maintenance-verification-${{ github.sha }}
          path: |
            maintenance_results
            audit_output
          if-no-files-found: warn
          retention-days: 7
