name: mission display name audit fix
# retry: test-dedent
# retry: locked-count-policy
on:
  push:
    branches: [fix/mission-display-names]
    paths:
      - .github/workflows/mission-name-fix.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Apply audited mission display-name decisions
        run: |
          python - <<'PY'
          import json
          import sys
          import textwrap
          from pathlib import Path

          ROOT=Path('.')
          TOOLS=ROOT/'tools'
          CATALOG=TOOLS/'ceviriler.json'
          catalog=json.loads(CATALOG.read_text(encoding='utf-8'))
          if catalog['translation_version']!='0.46.1-beta':
              raise ValueError('Unexpected base version: '+catalog['translation_version'])
          idx={(r['asset'],r['pointer']):r for r in catalog['translations']}

          updates={
            ('quests/fu_questlines/outpost/scienceoutpost_floranShop.questtemplate','/text'):
              "Floran babassının ^orange;Greenfinger Madalyasını^reset; kaybetti. Çok özel, çünkü babassı kabilede en iyi avcıydı ve savaşta çok Hylotl öldürdü. Belki ^green;Yemyeşil Harabeler'de^reset; bulursun?",
            ('quests/fu_questlines/outpost/scienceoutpost_gemShop.questtemplate','/text'):
              "İyi günler, karbon ve etten oluşan varlık. Bu Eld'uukhar'a yardım eder misin? Görkemli bir ^orange;Kristal Kupa^reset; arıyorum. Bunların ^orange;kadim tapınaklarda^reset; bulunabildiğini duydum. Bir tane bulursan çabalarının karşılığını fazlasıyla veririm.",
            ('quests/fu_questlines/outpost/scienceoutpost_kirhosShop.questtemplate','/text'):
              "^green;Evernight Tropik Ormanı'nda^reset; bir yerlerde ^orange;Uzaylı Yayın Düğümü^reset; denen nadir bir bileşen bulunduğunu duydum. Gerçekten güçlü bir FTL motorunda kullanılabilirmiş. Şimdilik söylentiden ibaret ama... diyelim ki bir tane buldun, sana verecek bir şeyim olabilir.",

            ('quests/ancienttemple.questtemplate','/title'):"^green;Kadim Tapınak",
            ('quests/ancienttemple.questtemplate','/scriptConfig/turnInDescription'):"Kadim Tapınağa git ve keşfet.",
            ('quests/avianhydro.questtemplate','/title'):"^green;Su Dağıtım Merkezi",
            ('quests/avianhydro.questtemplate','/scriptConfig/turnInDescription'):"Büyük hazine için Su Dağıtım Merkezini araştır.",
            ('quests/evernight.questtemplate','/title'):"^green;Evernight Tropik Ormanı",
            ('quests/evernight.questtemplate','/scriptConfig/turnInDescription'):"SAIL üzerinden koordinatları takip ederek Evernight Tropik Ormanı'na git ve bölgeyi araştır.",
            ('quests/forestoffae.questtemplate','/title'):"^green;Fae Ormanı",
            ('quests/forestoffae.questtemplate','/scriptConfig/turnInDescription'):"Tarikatçıların Fae Ormanı'nı yozlaştırmasını engelle.",
            ('quests/grandarena.questtemplate','/title'):"^green;Büyük Arena",
            ('quests/grandarena.questtemplate','/scriptConfig/turnInDescription'):"Ölmeden Büyük Arena'daki tüm saldırı dalgalarını atlat.",
            ('quests/japaneseruins.questtemplate','/title'):"^green;Gigant Dağı",
            ('quests/japaneseruins.questtemplate','/scriptConfig/turnInDescription'):"Gigant Dağı'nın zirvesini araştır.",
            ('quests/pavillion.questtemplate','/title'):"^green;Takeshi's Castle",
            ('quests/pavillion.questtemplate','/scriptConfig/turnInDescription'):"Takeshi's Castle'a hücum et ve Prenses Koto'yu kurtar!",
            ('quests/towerinvincible.questtemplate','/title'):"^green;Yenilmez Kule",
            ('quests/towerinvincible.questtemplate','/scriptConfig/turnInDescription'):"Yenilmez Kule'deki korkunç savaş ağasını yen.",
            ('quests/verdantruins.questtemplate','/title'):"^green;Yemyeşil Harabeler",
            ('quests/verdantruins.questtemplate','/scriptConfig/turnInDescription'):"Yemyeşil Harabeler bölgesini keşfet.",

            ('ai/ancienttemple.aimission','/speciesText/default/buttonText'):"Kadim Tapınak (2)",
            ('ai/ancienttemple.aimission','/speciesText/default/repeatButtonText'):"Kadim Tapınak (2) (R)",
            ('ai/avianhydro.aimission','/speciesText/default/buttonText'):"Su Dağıtım Merkezi (6+)",
            ('ai/avianhydro.aimission','/speciesText/default/repeatButtonText'):"Su Dağıtım Merkezi (6+) (R)",
            ('ai/evernight.aimission','/speciesText/default/buttonText'):"Evernight Tropik Ormanı (5)",
            ('ai/evernight.aimission','/speciesText/default/repeatButtonText'):"Evernight Tropik Ormanı (5) (R)",
            ('ai/forestoffae.aimission','/speciesText/default/buttonText'):"Fae Ormanı (5)",
            ('ai/forestoffae.aimission','/speciesText/default/repeatButtonText'):"Fae Ormanı (5) (R)",
            ('ai/grandarena.aimission','/speciesText/default/buttonText'):"Büyük Arena (5)",
            ('ai/grandarena.aimission','/speciesText/default/repeatButtonText'):"Büyük Arena (5) (R)",
            ('ai/japaneseruins.aimission','/speciesText/default/buttonText'):"Gigant Dağı (8)",
            ('ai/japaneseruins.aimission','/speciesText/default/repeatButtonText'):"Gigant Dağı (8) (R)",
            ('ai/pavillion.aimission','/speciesText/default/buttonText'):"Takeshi's Castle (3)",
            ('ai/pavillion.aimission','/speciesText/default/repeatButtonText'):"Takeshi's Castle (3) (R)",
            ('ai/towerinvincible.aimission','/speciesText/default/buttonText'):"Yenilmez Kule (6)",
            ('ai/towerinvincible.aimission','/speciesText/default/repeatButtonText'):"Yenilmez Kule (6) (R)",
            ('ai/verdantruins.aimission','/speciesText/default/buttonText'):"Yemyeşil Harabeler (2)",
            ('ai/verdantruins.aimission','/speciesText/default/repeatButtonText'):"Yemyeşil Harabeler (2) (R)",
          }

          for key,tr in updates.items():
              if key not in idx:
                  raise ValueError('Missing target: '+repr(key))
              idx[key]['tr']=tr

          # Evidence-backed preserved display names stay exact.
          preserved={
            'Brine Star','Snow Crash','Sunset Riders','Sky Boulevard',
            'Techno City','Nightfort','Delta Freya II','Dantalion','Dreadwing'
          }
          for name in preserved:
              affected=[r for r in catalog['translations'] if name in str(r.get('en',''))]
              if not affected:
                  raise ValueError('Preserved display name absent from catalog: '+name)
              # At least one translated row must keep the proper token exact.
              if not any(name in str(r.get('tr','')) for r in affected):
                  raise ValueError('Preserved display name drift: '+name)

          catalog['translation_version']='0.46.2-beta'
          CATALOG.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # v0.46 manifest mirrors all SAIL rows exactly.
          v046_path=TOOLS/'v046_translations.json'
          v046=json.loads(v046_path.read_text(encoding='utf-8'))
          v046['translation_version']='0.46.2-beta'
          cidx={(r['asset'],r['pointer']):r for r in catalog['translations']}
          for r in v046['translations']:
              r['tr']=cidx[(r['asset'],r['pointer'])]['tr']
          v046_path.write_text(json.dumps(v046,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Mission/location terminology decisions.
          locked_path=TOOLS/'locked_terms.json'
          locked=json.loads(locked_path.read_text(encoding='utf-8'))
          decisions=[
            ('Ancient Temple','Kadim Tapınak','Görev/konum başlığı','Çevrilebilir betimleyici görev adı.'),
            ('Ancient Temples','Kadim Tapınaklar','Görev/konum genel çoğul','Outpost bağlamındaki çoğul kullanım.'),
            ('Hydro Center','Su Dağıtım Merkezi','Görev/konum başlığı','Aynı görevdeki Hydro Distribution Center ile tek ad altında birleştirilir.'),
            ('Hydro Distribution Center','Su Dağıtım Merkezi','Görev/konum başlığı','İşlevsel tesis adı; doğal Türkçe tercih edilir.'),
            ('Evernight Jungle','Evernight Tropik Ormanı','Görev/konum başlığı','Evernight özel çekirdeği korunur; Jungle tür adı Türkçeleştirilir.'),
            ('Forest of Fae','Fae Ormanı','Görev/konum başlığı','Fae özel/fantastik çekirdeği korunur; Forest Türkçeleştirilir.'),
            ('Grand Arena','Büyük Arena','Görev/konum başlığı','Betimleyici görev adı.'),
            ('Mount Gigant','Gigant Dağı','Görev/konum başlığı','Gigant özel çekirdeği korunur; Mount Türkçeleştirilir.'),
            ("Takeshi's Castle","Takeshi's Castle",'Dış referans / görev başlığı',"Takeshi's Castle referansı exact korunur."),
            ('Castle Takeshi',"Takeshi's Castle",'Dış referans / görev başlığı',"Kaynak içi ters yazım, referansın kanonik biçimine eşitlenir."),
            ('Tower Invincible','Yenilmez Kule','Görev/konum başlığı','Kaynakta dış referans kanıtı bulunmayan betimleyici başlık.'),
            ('Verdant Ruins','Yemyeşil Harabeler','Görev/konum başlığı','Verdant proje kullanımındaki yemyeşil karşılığıyla eşlenir.'),
            ('Brine Star','Brine Star','Lore özel yer adı','Codex ve görev zincirinde özel yer adı olarak kullanılır.'),
            ('Snow Crash','Snow Crash','Dış referans / görev başlığı','Neal Stephenson eser başlığı referansı korunur.'),
            ('Sunset Riders','Sunset Riders','Dış referans / görev başlığı','Konami western arcade oyunu referansı korunur.'),
            ('Sky Boulevard','Sky Boulevard','Dış referans / görev başlığı',"Whale's Voyage yer adı referansı korunur."),
            ('Techno City','Techno City','Dış referans / lore yer adı','FU codexindeki arcade-game referansı ve Guardians yer adı korunur.'),
            ('Nightfort','Nightfort','Lore özel yer adı','Nightar kralının hisarı için kullanılan birleşik özel ad.'),
            ('Delta Freya II','Delta Freya II','Lore özel yer adı','Özel gökcismi/konum adı.'),
            ('Dantalion','Dantalion','Özel ad','Görevdeki özel ad.'),
            ('Dreadwing','Dreadwing','Özel ad','Boss özel adı.'),
          ]
          bysrc={t.get('source'):t for t in locked['terms']}
          for source,tr,context,note in decisions:
              entry={
                'source':source,'context':context,'type':'Görev/Konum',
                'tr':tr,'forbidden':'','status':'LOCKED','note':note
              }
              if source in bysrc:
                  bysrc[source].update(entry)
              else:
                  locked['terms'].append(entry)
          locked_path.write_text(json.dumps(locked,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          # Make the global locked-term count test robust while retaining a floor.
          qa_test=TOOLS/'tests'/'test_qa_integrity.py'
          text=qa_test.read_text(encoding='utf-8')
          text=text.replace(
              "self.assertEqual(result['locked_terms'], 507)",
              "self.assertEqual(result['locked_terms'], sum(t['status'] == 'LOCKED' for t in self.terms['terms']))"
          )
          text=text.replace(
              "self.assertGreaterEqual(len(engine.exact), 507)",
              "self.assertGreaterEqual(len(engine.exact), 507)"
          )
          qa_test.write_text(text,encoding='utf-8')

          # Version gates.
          for p in (TOOLS/'generate_v046.py', TOOLS/'tests'/'test_v046.py'):
              text=p.read_text(encoding='utf-8').replace('"0.46.1-beta"','"0.46.2-beta"')
              p.write_text(text,encoding='utf-8')

          # Dedicated regression test for audited display names.
          test_path=TOOLS/'tests'/'test_mission_display_names.py'
          test_path.write_text(textwrap.dedent(r'''
          import json
          import unittest
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[2]
          TOOLS = ROOT / "tools"

          class MissionDisplayNameTests(unittest.TestCase):
              @classmethod
              def setUpClass(cls):
                  catalog=json.loads((TOOLS/"ceviriler.json").read_text(encoding="utf-8"))
                  cls.by={(r["asset"],r["pointer"]):r for r in catalog["translations"]}

              def test_localized_mission_names(self):
                  expected={
                      ("quests/ancienttemple.questtemplate","/title"):"^green;Kadim Tapınak",
                      ("quests/avianhydro.questtemplate","/title"):"^green;Su Dağıtım Merkezi",
                      ("quests/evernight.questtemplate","/title"):"^green;Evernight Tropik Ormanı",
                      ("quests/forestoffae.questtemplate","/title"):"^green;Fae Ormanı",
                      ("quests/grandarena.questtemplate","/title"):"^green;Büyük Arena",
                      ("quests/japaneseruins.questtemplate","/title"):"^green;Gigant Dağı",
                      ("quests/towerinvincible.questtemplate","/title"):"^green;Yenilmez Kule",
                      ("quests/verdantruins.questtemplate","/title"):"^green;Yemyeşil Harabeler",
                      ("ai/ancienttemple.aimission","/speciesText/default/buttonText"):"Kadim Tapınak (2)",
                      ("ai/avianhydro.aimission","/speciesText/default/buttonText"):"Su Dağıtım Merkezi (6+)",
                      ("ai/evernight.aimission","/speciesText/default/buttonText"):"Evernight Tropik Ormanı (5)",
                      ("ai/forestoffae.aimission","/speciesText/default/buttonText"):"Fae Ormanı (5)",
                      ("ai/grandarena.aimission","/speciesText/default/buttonText"):"Büyük Arena (5)",
                      ("ai/japaneseruins.aimission","/speciesText/default/buttonText"):"Gigant Dağı (8)",
                      ("ai/towerinvincible.aimission","/speciesText/default/buttonText"):"Yenilmez Kule (6)",
                      ("ai/verdantruins.aimission","/speciesText/default/buttonText"):"Yemyeşil Harabeler (2)",
                  }
                  for key,value in expected.items():
                      with self.subTest(key=key):
                          self.assertEqual(self.by[key]["tr"],value)

              def test_reference_titles_are_intentionally_preserved(self):
                  expected={
                      ("quests/alienjungle.questtemplate","/title"):"^green;Brine Star",
                      ("quests/snowcrash.questtemplate","/title"):"^green;Snow Crash",
                      ("quests/sunsetriders.questtemplate","/title"):"^green;Sunset Riders",
                      ("quests/skytemple.questtemplate","/title"):"^green;Sky Boulevard",
                      ("ai/nightfort.aimission","/speciesText/default/buttonText"):"Nightfort'u Ziyaret Et",
                      ("ai/shoggothmission.aimission","/speciesText/default/buttonText"):"^#7fac66;Delta Freya II^reset; (7+)",
                  }
                  for key,value in expected.items():
                      with self.subTest(key=key):
                          self.assertEqual(self.by[key]["tr"],value)

              def test_takeshi_reference_is_normalized(self):
                  self.assertEqual(self.by[("quests/pavillion.questtemplate","/title")]["tr"],"^green;Takeshi's Castle")
                  self.assertEqual(self.by[("ai/pavillion.aimission","/speciesText/default/buttonText")]["tr"],"Takeshi's Castle (3)")

          if __name__ == "__main__":
              unittest.main()
          ''').lstrip(),encoding='utf-8')

          # Documentation: retire the blanket "special name" rule.
          decisions_path=ROOT/'docs'/'DECISIONS.md'
          text=decisions_path.read_text(encoding='utf-8')
          old='- `Brine Star`, `Ancient Temple`, `Hydro Center`, `Evernight Jungle`, `Forest of Fae`, `Grand Arena`, `Mount Gigant`, `Castle Takeshi`, `Techno City`, `Sky Boulevard`, `Snow Crash`, `Sunset Riders`, `Tower Invincible` ve `Verdant Ruins` SAIL/harita zinciriyle eşleşen özel görev adları olarak özgün bırakıldı.'
          text=text.replace(old,'- Eski toplu "özel görev adı" kararı v0.46.2 denetiminde kaldırıldı; adlar artık teknik kimlik, lore özel adı, betimleyici başlık ve dış referans olarak ayrı ayrı sınıflandırılır.')
          text=text.replace(
              '- `Verdant Ruins`, `Ancient Temple` ve `Evernight Jungle` şu aşamada özel görev/konum adları olarak korunur. Bu adlar, ilgili görev/mission/harita zinciri bütünüyle yerelleştirilmeden tek bir Outpost metninde Türkçeleştirilmez.',
              '- Verdant Ruins / Ancient Temple / Evernight Jungle için eski geçici koruma kararı v0.46.2 ile sona erdi; ilgili görev ve SAIL zinciri artık birlikte yerelleştirilir.'
          )
          marker='### v0.46.1 - Jungle terminoloji standardı'
          audit_note='''### v0.46.2 - Görev/konum görünen ad denetimi

          - Eski "özel görev adıysa İngilizce bırak" yaklaşımı kaldırıldı.
          - Betimleyici/generic başlıklar: Ancient Temple -> Kadim Tapınak, Hydro Center / Hydro Distribution Center -> Su Dağıtım Merkezi, Grand Arena -> Büyük Arena, Tower Invincible -> Yenilmez Kule, Verdant Ruins -> Yemyeşil Harabeler.
          - Karma özel adlar: Evernight Jungle -> Evernight Tropik Ormanı, Forest of Fae -> Fae Ormanı, Mount Gigant -> Gigant Dağı.
          - Dış referans veya gerçek lore özel adı olarak exact korunanlar: Brine Star, Snow Crash, Sunset Riders, Sky Boulevard, Techno City, Nightfort, Delta Freya II, Dantalion, Dreadwing.
          - Takeshi's Castle dış referans olarak korunur; kaynak içindeki Castle Takeshi varyantı kanonik Takeshi's Castle biçimine eşitlenir.
          - Görev başlığı, hedef açıklaması, SAIL butonu ve önceki Outpost referansları birlikte eşitlendi.
          '''
          if '### v0.46.2 - Görev/konum görünen ad denetimi' not in text:
              text=text.rstrip()+'\n\n'+audit_note.strip()+'\n'
          decisions_path.write_text(text,encoding='utf-8')

          summary_path=ROOT/'docs'/'KONTROL_OZETI.txt'
          text=summary_path.read_text(encoding='utf-8')
          text=text.replace(
              '- Verdant Ruins / Ancient Temple / Evernight Jungle özel görev-konum adları, ilgili mission zincirleri bütünüyle yerelleştirilene kadar korunuyor.',
              '- Eski Verdant Ruins / Ancient Temple / Evernight Jungle koruma kararı v0.46.2 denetiminde kaldırıldı; görev ve SAIL görünen adları aynı kanonik Türkçe adlara bağlandı.'
          )
          summary_path.write_text(text.rstrip()+'\n',encoding='utf-8')

          checkpoint=ROOT/'FU_SESSION_CHECKPOINT.md'
          text=checkpoint.read_text(encoding='utf-8')
          note='''## v0.46.2 görev/konum adı denetim checkpoint
          - Eski toplu "özel ad" varsayımı kaldırıldı.
          - Çevrilen başlıklar: Kadim Tapınak, Su Dağıtım Merkezi, Evernight Tropik Ormanı, Fae Ormanı, Büyük Arena, Gigant Dağı, Yenilmez Kule, Yemyeşil Harabeler.
          - Exact korunan kanıtlı referans/özel adlar: Brine Star, Snow Crash, Sunset Riders, Sky Boulevard, Techno City, Nightfort, Delta Freya II, Dantalion, Dreadwing.
          - Takeshi's Castle exact dış referans olarak korunur; Castle Takeshi varyantı buna eşitlenir.
          - Katalog sürümü: 0.46.2-beta.
          - Oyun içi LQA: NOT TESTED.
          '''
          if '## v0.46.2 görev/konum adı denetim checkpoint' not in text:
              text=text.rstrip()+'\n\n'+note.strip()+'\n'
          checkpoint.write_text(text,encoding='utf-8')

          readme=ROOT/'README.md'
          text=readme.read_text(encoding='utf-8')
          text=text.replace('**Güncel sürüm:** v0.46.1 Beta','**Güncel sürüm:** v0.46.2 Beta')
          text=text.replace('v0.46.1 Beta itibarıyla:','v0.46.2 Beta itibarıyla:')
          text=text.replace('dist/FU_Turkce_v0.46.1_Beta.zip','dist/FU_Turkce_v0.46.2_Beta.zip')
          text=text.replace(
              'v0.46.1 bakımında generic Jungle terminolojisi Tropik Orman olarak kilitlendi ve eski karşılıklar geriye dönük temizlendi. Sonraki paket güncel Remaining Scope Audit sıralamasından seçilecektir.',
              'v0.46.1 bakımında generic Jungle terminolojisi Tropik Orman olarak kilitlendi. v0.46.2 bakımında eski toplu görev/konum özel-ad kararı yeniden denetlendi; betimleyici başlıklar Türkçeleştirildi, kanıtlı dış referanslar ve gerçek özel adlar korundu. Sonraki paket güncel Remaining Scope Audit sıralamasından seçilecektir.'
          )
          readme.write_text(text.rstrip()+'\n',encoding='utf-8')

          sys.path.insert(0,str(TOOLS))
          from rule_data import render_terminology
          (ROOT/'docs'/'TERMINOLOGY.md').write_text(render_terminology(locked),encoding='utf-8')

          # Normalize trailing newlines.
          for p in (decisions_path,summary_path,checkpoint,readme):
              p.write_text(p.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')

          print('mission display-name audit fixes applied:',len(updates))
          PY
      - name: Fetch pinned FU
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$PIN"
      - name: Verify all regressions and pinned build
        run: |
          python tools/qa_integrity.py --write-docs
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/qa_integrity.py
          python tools/generate_v045.py --source fu_source
          python tools/generate_v046.py --source fu_source
          python tools/build_validate.py --source-dir fu_source --output build_output
          python tools/audit_remaining.py --source fu_source --json-output audit_output/kalan.json --md-output audit_output/KALAN.md
          git diff --check
      - name: Commit tested source changes
        run: |
          rm -rf build_output audit_output fu_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md FU_SESSION_CHECKPOINT.md docs tools
          git diff --cached --check
          git commit -m "fix: görev ve konum görünen adlarını kanıta göre eşitle [skip ci]"
          git fetch origin fix/mission-display-names
          test "$(git rev-parse origin/fix/mission-display-names)" = "$GITHUB_SHA"
          git push origin HEAD:fix/mission-display-names
