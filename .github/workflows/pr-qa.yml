name: FU Turkce PR QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fu-pr-qa-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-qa:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Lua 5.4 test runtime
        run: python -m pip install lupa==2.8
      - name: Run regressions with Windows defaults
        run: python -m unittest discover -s tools/tests -v
  pr-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Reject direct generated-output edits
        run: python tools/check_generated_changes.py
      - name: Install Lua behavior test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0
      - name: Compile and run all regressions
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/qa_integrity.py
      - name: Fetch pinned FU and validate source
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$PIN"
          python tools/generate_v045.py --source fu_source
          python tools/generate_v046.py --source fu_source
          python tools/generate_v047.py --source fu_source
          python tools/generate_v048.py --source fu_source
          python tools/generate_v049.py --source fu_source
          python tools/generate_v050.py --source fu_source
          python tools/generate_v051.py --source fu_source
          python tools/generate_v052.py --source fu_source
          python tools/generate_v053.py --source fu_source
          python tools/generate_v054.py --source fu_source
          python tools/generate_v055.py --source fu_source
          python tools/generate_v056.py --source fu_source
          python tools/generate_v057.py --source fu_source
          python tools/generate_v058.py --source fu_source
          python tools/generate_v059.py --source fu_source
          python tools/generate_v060.py --source fu_source
          python tools/generate_v061.py --source fu_source
          python tools/generate_v062.py --source fu_source
          python tools/generate_v063.py --source fu_source
          python tools/generate_v064.py --source fu_source
          python tools/generate_v065.py --source fu_source
          python -m pip install Pillow==11.3.0
          python tools/check_ui_lqa_20260925.py --source fu_source
          python tools/build_validate.py --source-dir fu_source --output build_output
      - name: Exercise the freshly built Lua
        env:
          FU_TEST_MOD_DIR: build_output/FU_Turkce
        run: |
          python -m unittest discover -s tools/tests -p 'test_lua_behavior.py' -v
          python -m unittest discover -s tools/tests -p 'test_ui_lqa_20260925.py' -v
      - name: Check whitespace and conflict markers
        run: git diff --check
