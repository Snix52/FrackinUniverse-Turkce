name: Apply SAIL startup hotfix

on:
  push:
    branches:
      - fix/sail-startup-dialogue-20260925
    paths:
      - .github/workflows/sail-startup-hotfix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/sail-startup-dialogue-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Apply source-only SAIL fix
        run: python tools/apply_sail_startup_hotfix.py
      - name: Run focused static checks
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -p 'test_audit_remaining.py' -v
          python tools/qa_integrity.py
          git diff --check
      - name: Commit clean hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "fix: localize embedded SAIL startup dialogue"
          git push origin HEAD:fix/sail-startup-dialogue-20260925
