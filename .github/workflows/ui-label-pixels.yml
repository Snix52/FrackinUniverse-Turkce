name: Verify integer UI label positions
on:
  push:
    branches: [fix/lqa-tricorder-gps-mech-20260925]
    paths: [.github/workflows/ui-label-pixels.yml]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/lqa-tricorder-gps-mech-20260925
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0 lupa==2.8
      - name: Fetch pinned source
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --depth=1 --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git "$RUNNER_TEMP/fu_source"
          git -C "$RUNNER_TEMP/fu_source" fetch --depth=1 origin "$PIN"
          git -C "$RUNNER_TEMP/fu_source" checkout --detach "$PIN"
      - name: Bind native label positions to whole pixels
        run: |
          python - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'tools')
          helper = Path('tools/ui_lqa_assets.py')
          text = helper.read_text(encoding='utf-8')
          for old,new in [
              ('gx = (min(x for x, y in glyphs) + max(x for x, y in glyphs) + 1) / 2', 'gx = (min(x for x, y in glyphs) + max(x for x, y in glyphs) + 1) // 2'),
              ('gy = 219 - (y1 + y2) / 2', 'gy = 219 - (y1 + y2) // 2'),
          ]:
              assert text.count(old)==1, old
              text=text.replace(old,new,1)
          helper.write_text(text,encoding='utf-8')
          from ui_lqa_assets import render_images, config_replacements, MECH_CONFIG
          from check_ui_lqa_20260925 import rebuild_raw
          source=Path(os.environ['RUNNER_TEMP'])/'fu_source'
          spec=json.loads(Path('tools/ui_lqa_20260925.json').read_text(encoding='utf-8'))
          images, labels=render_images(source,spec)
          assert all(type(p) is int for v in labels.values() for p in v['position'])
          for name,content in images.items():
              assert (Path('tools/custom_assets')/name).read_bytes()==content
          path=Path('tools/raw_runtime_overrides.json')
          manifest=json.loads(path.read_text(encoding='utf-8'))
          entry=next(s for s in manifest['assets'] if s['asset']==MECH_CONFIG)
          entry['replacements']=config_replacements((source/MECH_CONFIG).read_text(encoding='utf-8-sig'),spec,labels)
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          (Path('tools/raw_overrides')/MECH_CONFIG).write_text(rebuild_raw(source,{MECH_CONFIG})[MECH_CONFIG],encoding='utf-8')
          test=Path('tools/tests/test_ui_lqa_20260925.py')
          text=test.read_text(encoding='utf-8')
          anchor="        self.assertEqual(len([key for key in config['gui'] if key.startswith('fuTrFuelLegend')]), 8)\n"
          assert text.count(anchor)==1
          addition="        for key, value in config['gui'].items():\n            if key.startswith('fuTrFuelLegend'):\n                self.assertTrue(all(type(p) is int for p in value['position']))\n"
          test.write_text(text.replace(anchor,anchor+addition,1),encoding='utf-8')
          PY
      - name: Revalidate source and actual build
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/check_ui_lqa_20260925.py --source "$RUNNER_TEMP/fu_source"
          python tools/build_validate.py --source-dir "$RUNNER_TEMP/fu_source" --output "$RUNNER_TEMP/ui_integer_build"
          FU_TEST_MOD_DIR="$RUNNER_TEMP/ui_integer_build/FU_Turkce" python -m unittest discover -s tools/tests -p 'test_ui_lqa_20260925.py' -v
      - name: Commit only tested display coordinates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- tools/ui_lqa_assets.py tools/raw_runtime_overrides.json tools/raw_overrides/interface/mechfuel/mechfuel.config tools/tests/test_ui_lqa_20260925.py
          git diff --cached --check
          git commit -m "fix: align native Mech labels to integer pixel positions"
          git push origin HEAD:fix/lqa-tricorder-gps-mech-20260925
