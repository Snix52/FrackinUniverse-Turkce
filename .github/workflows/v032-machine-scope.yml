name: v0.32 Machine Scope Export
on:
  push:
    branches: [v032/machines-crafting]
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v032/machines-crafting
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Fetch pinned FU source
        run: |
          FU_SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_SOURCE_COMMIT"
      - name: Export machine/crafting candidates
        run: |
          python tools/export_remaining_category.py \
            --source fu_source \
            --category "Makineler, üretim ve dükkân nesneleri" \
            --output machine_scope.json
      - uses: actions/upload-artifact@v4
        with:
          name: v032-machine-scope
          path: machine_scope.json
