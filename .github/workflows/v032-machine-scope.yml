name: FU Turkce v0.32 Machine Scope

on:
  push:
    branches: [v032/research-quest-ui]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fu-v032-machine-scope
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: v032/research-quest-ui

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Fetch pinned FU source
        run: |
          FU_SOURCE_COMMIT="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_SOURCE_COMMIT"

      - name: Export machine candidates
        run: python tools/export_v032_machine_candidates.py --source fu_source --output v032_scope/machine_candidates.json

      - name: Upload scope
        uses: actions/upload-artifact@v4
        with:
          name: fu-v032-machine-candidates
          path: v032_scope/machine_candidates.json
          if-no-files-found: error
