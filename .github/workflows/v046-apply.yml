name: v046 apply and verify
# retry: mixed-provenance-per-field
on:
  push:
    branches: [work/v046-races-sail]
    paths:
      - .github/workflows/v046-apply.yml
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch pinned FU
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$PIN"
      - name: Apply reviewed v0.46 source migration
        run: python tools/v046_apply_temp.py
      - name: Verify source and regressions
        run: |
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v
          python tools/qa_integrity.py
          python tools/generate_v045.py --source fu_source
          python tools/generate_v046.py --source fu_source
          python tools/build_validate.py --source-dir fu_source --output build_output
          python tools/audit_remaining.py --source fu_source --json-output audit_output/kalan.json --md-output audit_output/KALAN.md
          python - <<'PY'
          import json
          d=json.load(open('audit_output/kalan.json',encoding='utf-8'))
          x=d['remaining']['confirmed_by_category'].get('Irklar ve SAIL/AI',{})
          assert x.get('fields',0)==0, x
          assert x.get('assets',0)==0, x
          print('v0.46 category confirmed debt: 0')
          PY
          git diff --check
      - name: Commit tested source only
        run: |
          rm -rf build_output audit_output fu_source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: v0.46 Irklar ve SAIL/AI kapsamını kapat [skip ci]"
          git fetch origin work/v046-races-sail
          test "$(git rev-parse origin/work/v046-races-sail)" = "$GITHUB_SHA"
          git push origin HEAD:work/v046-races-sail
