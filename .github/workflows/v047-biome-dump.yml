name: v047 biome audit verification
on:
  push:
    branches: [work/v047-biome-names]
    paths:
      - .github/workflows/v047-biome-dump.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch pinned FU
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$PIN"
      - name: Verify biome audit correction
        run: |
          python -m compileall -q tools
          python -m unittest tools.tests.test_audit_remaining -v
          python tools/audit_remaining.py --source fu_source --json-output audit_output/kalan.json --md-output audit_output/KALAN.md
          python - <<'PY'
          import json
          d=json.load(open('audit_output/kalan.json',encoding='utf-8'))
          r=d['remaining']
          biome_root=r['confirmed_by_source_root'].get('biomes',{'assets':0,'fields':0})
          cat=r['confirmed_by_category']['Biyom, zindan ve dünya sistemleri']
          if biome_root['fields'] != 0 or biome_root['assets'] != 0:
              raise SystemExit(f"biomes root still confirmed: {biome_root}")
          if cat['fields'] != 1952 or cat['assets'] != 740:
              raise SystemExit(f"category drift: {cat}")
          if r['confirmed_fields'] != 50298 or r['confirmed_assets'] != 12452:
              raise SystemExit(f"overall drift: fields={r['confirmed_fields']} assets={r['confirmed_assets']}")
          print(json.dumps({
              'overall_confirmed_fields':r['confirmed_fields'],
              'overall_confirmed_assets':r['confirmed_assets'],
              'biome_category':cat,
              'biomes_root':biome_root,
              'review_fields':r['review_fields'],
              'review_assets':r['review_assets'],
          },ensure_ascii=False,indent=2))
          PY
          git diff --check
      - uses: actions/upload-artifact@v7
        with:
          name: v047-biome-audit-verified
          path: |
            audit_output/kalan.json
            audit_output/KALAN.md
          retention-days: 3
