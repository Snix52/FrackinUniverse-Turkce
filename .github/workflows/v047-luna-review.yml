name: Isolated v047 Luna review
on:
  push:
    branches: [ops/v047-luna-review-20260923]
    paths: [.github/workflows/v047-luna-review.yml]
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 3f54a6900de2ffa75e24f5cc2ec9306e6172d033
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Prepare evidence
        run: mkdir -p review_evidence
      - name: Fetch exact pinned FU source
        run: |
          FU_PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json", encoding="utf-8"))["commit"])')"
          test "$FU_PIN" = 329e714b3fe87571055c8ad7aa38135d199d3317
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$FU_PIN"
      - name: Export repository and relevant exact upstream text
        run: |
          git archive --format=tar.gz HEAD > review_evidence/repository.tar.gz
          python - <<'PY'
          import json, pathlib, tarfile
          root = pathlib.Path('fu_source')
          rows = json.load(open('tools/v047_translations.json', encoding='utf-8'))['translations']
          selected = {root / row['asset'] for row in rows}
          for folder, patterns in [('plants', ['*.bush', '*.grass', '*.modular']), ('biomes', ['*.biome', '*.patch']), ('liquids', ['*.liquid']), ('items/liquids', ['*.liqitem'])]:
              for pattern in patterns:
                  selected.update((root / folder).rglob(pattern))
          for path in root.rglob('*.lua'):
              if 'liquidConfig' in path.read_text(encoding='utf-8', errors='replace'):
                  selected.add(path)
          with tarfile.open('review_evidence/pinned-source-text.tar.gz', 'w:gz') as archive:
              for path in sorted(selected):
                  archive.add(path, arcname=path.as_posix())
          pathlib.Path('review_evidence/context.json').write_text(json.dumps({'translation_commit':'3f54a6900de2ffa75e24f5cc2ec9306e6172d033','upstream_commit':'329e714b3fe87571055c8ad7aa38135d199d3317','source_files':len(selected)}, indent=2)+'\n')
          PY
      - name: Install existing Lua test runtime
        run: sudo apt-get update -qq && sudo apt-get install -y liblua5.4-0
      - name: Compile and run existing regression and integrity checks
        run: |
          set -o pipefail
          python -m compileall -q tools
          python -m unittest discover -s tools/tests -v 2>&1 | tee review_evidence/regression.log
          python tools/qa_integrity.py 2>&1 | tee review_evidence/integrity.log
      - name: Verify source gates and full-source build
        run: |
          set -o pipefail
          python tools/generate_v045.py --source fu_source 2>&1 | tee review_evidence/source-v045.log
          python tools/generate_v046.py --source fu_source 2>&1 | tee review_evidence/source-v046.log
          python tools/generate_v047.py --source fu_source 2>&1 | tee review_evidence/source-v047.log
          python tools/build_validate.py --source-dir fu_source --output build_output 2>&1 | tee review_evidence/build.log
          FU_TEST_MOD_DIR=build_output/FU_Turkce python -m unittest discover -s tools/tests -p 'test_lua_behavior.py' -v 2>&1 | tee review_evidence/lua.log
          cp build_output/validation.json review_evidence/validation.json
          git diff --check
      - name: Audit remaining scope
        run: |
          set -o pipefail
          python tools/audit_remaining.py --source fu_source 2>&1 | tee review_evidence/audit.log
          cp -a audit_output review_evidence/audit_output
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v047-luna-review-baseline
          path: review_evidence
          retention-days: 1
          if-no-files-found: error
