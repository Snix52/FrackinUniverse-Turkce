name: v047 plants liquids candidate dump
on:
  push:
    branches: [work/v047-plants-liquids]
    paths:
      - .github/workflows/v047-plants-liquids-dump.yml
permissions:
  contents: read
jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Fetch pinned FU
        run: |
          PIN="$(python -c 'import json; print(json.load(open("tools/kaynaklar.json"))["commit"])')"
          git clone --filter=blob:none --no-checkout https://github.com/sayterdarkwynd/FrackinUniverse.git fu_source
          git -C fu_source checkout --detach "$PIN"
      - name: Export exact plants and liquids candidates
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path,PurePosixPath
          from collections import Counter,defaultdict
          sys.path.insert(0,'tools')
          import audit_remaining as audit

          translated,_=audit.load_translations(Path('tools/ceviriler.json'))
          candidates={}
          for root in ('plants','liquids'):
              base=Path('fu_source')/root
              for path in sorted(base.rglob('*')):
                  if not path.is_file():
                      continue
                  rel=PurePosixPath(path.relative_to('fu_source').as_posix())
                  if audit.excluded_path(rel):
                      continue
                  if path.suffix.lower() in audit.BINARY_SUFFIXES or path.stat().st_size>8_000_000:
                      continue
                  try:
                      raw=path.read_text(encoding='utf-8-sig')
                  except Exception:
                      continue
                  if not raw.lstrip().startswith(('{','[')):
                      continue
                  try:
                      data=audit.parse_jsonc(raw)
                  except Exception:
                      continue
                  for row in audit.candidates_from_data(rel.as_posix(),data):
                      row=audit.v046_candidate_visibility(row)
                      if row is None:
                          continue
                      key=(row.asset,row.pointer)
                      if key in translated or audit.audit_excluded_candidate(row.asset,row.pointer):
                          continue
                      if row.confidence!='confirmed' or row.category!='Biyom, zindan ve dünya sistemleri':
                          continue
                      prev=candidates.get(key)
                      if prev is None or (prev.confidence=='review' and row.confidence=='confirmed'):
                          candidates[key]=row

          rows=[candidates[k] for k in sorted(candidates)]
          byroot=Counter(PurePosixPath(r.asset).parts[0] for r in rows)
          assets_by_root={root:len({r.asset for r in rows if r.asset.startswith(root+'/')}) for root in ('plants','liquids')}
          expected_fields={'plants':170,'liquids':36}
          expected_assets={'plants':66,'liquids':36}
          for root in expected_fields:
              if byroot[root]!=expected_fields[root]:
                  raise ValueError(f'{root} field drift {byroot[root]} != {expected_fields[root]}')
              if assets_by_root[root]!=expected_assets[root]:
                  raise ValueError(f'{root} asset drift {assets_by_root[root]} != {expected_assets[root]}')

          catalog=json.loads(Path('tools/ceviriler.json').read_text(encoding='utf-8'))
          existing=defaultdict(set)
          for r in catalog['translations']:
              existing[str(r['en'])].add(str(r['tr']))
          locked=json.loads(Path('tools/locked_terms.json').read_text(encoding='utf-8'))
          locked_by_source=defaultdict(list)
          for t in locked['terms']:
              if t.get('status')!='LOCKED':
                  continue
              for form in t.get('forms') or [{'en':x.strip()} for x in t.get('source','').split(' / ')]:
                  en=form.get('en')
                  if en:
                      locked_by_source[str(en)].append(t)

          out_rows=[]
          for r in rows:
              out_rows.append({
                  'asset':r.asset,'pointer':r.pointer,'en':r.value,'origin':r.origin,'key':r.key,
                  'existing_tr':sorted(existing.get(r.value,())),
                  'locked':locked_by_source.get(r.value,[]),
              })
          out={
              'pinned_fu_commit':audit.PINNED_COMMIT,
              'fields':len(rows),
              'assets':len({r.asset for r in rows}),
              'unique_sources':len({r.value for r in rows}),
              'fields_by_root':dict(byroot),
              'assets_by_root':assets_by_root,
              'pointer_counts':dict(Counter(r.pointer for r in rows).most_common()),
              'key_counts':dict(Counter(r.key for r in rows).most_common()),
              'rows':out_rows,
          }
          Path('v047_plants_liquids_candidates.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({k:out[k] for k in ('fields','assets','unique_sources','fields_by_root','assets_by_root','pointer_counts','key_counts')},ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: v047-plants-liquids-candidates
          path: v047_plants_liquids_candidates.json
          retention-days: 3
